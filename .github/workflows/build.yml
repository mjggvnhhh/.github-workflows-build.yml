name: Build Clawd APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          set -e
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_CLAWD'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Clawd"
          include(":app")
          EOF_CLAWD
          mkdir -p .
          cat > build.gradle.kts <<'EOF_CLAWD'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_CLAWD
          mkdir -p .
          cat > gradle.properties <<'EOF_CLAWD'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_CLAWD
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_CLAWD'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.clawd"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.clawd"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_CLAWD'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Clawd"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClawdService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating mascot overlay"/>
                  </service>
              </application>
          </manifest>
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/ClawdView.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import kotlin.random.Random

          class ClawdView(ctx: Context) : View(ctx) {

              private val body = Paint().apply { color = 0xFFDA7756.toInt() }
              private val dark = Paint().apply { color = 0xFF111111.toInt() }
              private val red = Paint().apply { color = 0xFFE8384F.toInt() }
              private val lap = Paint().apply { color = 0xFFB5B1A8.toInt() }
              private val lapDark = Paint().apply { color = 0xFF8E8A82.toInt() }
              private val u = resources.displayMetrics.density * 6f

              // 0 обычный, 1 радостный, 2 влюблённый, 3 головокружение, 4 удивлён, 5 злой
              var mood = 0
                  set(v) { field = v; invalidate() }

              private var step = 0
              private var blink = false
              // -1 = ноутбука нет, 0..16 = кадры анимации с ноутбуком
              private var laptopTick = -1
              private val handler = Handler(Looper.getMainLooper())

              fun startLaptop() {
                  if (laptopTick < 0) laptopTick = 0
              }

              private val walk = object : Runnable {
                  override fun run() {
                      step = 1 - step
                      blink = Random.nextInt(6) == 0
                      if (laptopTick >= 0) {
                          laptopTick++
                          if (laptopTick > 16) laptopTick = -1
                      } else if (Random.nextInt(130) == 0) {
                          laptopTick = 0
                      }
                      invalidate()
                      handler.postDelayed(this, 300)
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  handler.post(walk)
              }

              override fun onDetachedFromWindow() {
                  handler.removeCallbacks(walk)
                  super.onDetachedFromWindow()
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension((16 * u).toInt(), (12 * u).toInt())
              }

              private fun r(c: Canvas, x: Float, y: Float, w: Float, h: Float, p: Paint) {
                  c.drawRect(x * u, y * u, (x + w) * u, (y + h) * u, p)
              }

              private fun pat(c: Canvas, x: Int, y: Int, rows: List<String>, p: Paint) {
                  rows.forEachIndexed { j, row ->
                      row.forEachIndexed { i, ch ->
                          if (ch == '1') r(c, (x + i).toFloat(), (y + j).toFloat(), 1f, 1f, p)
                      }
                  }
              }

              override fun onDraw(c: Canvas) {
                  val typing = laptopTick >= 0
                  val bob = if (typing || step == 0) 0f else 0.5f
                  c.save()
                  c.translate(0f, bob * u)

                  // широкое приплюснутое тело
                  r(c, 2f, 1f, 12f, 7f, body)

                  // ручки (при печати прыгают по очереди)
                  val ly = if (typing) 3f + step else 3f
                  val ry = if (typing) 4f - step else 3f
                  r(c, 0f, ly, 2f, 3f, body)
                  r(c, 14f, ry, 2f, 3f, body)

                  // 4 тонкие короткие ножки
                  val la = if (step == 0) 3f else 2.2f
                  val lb = if (step == 0) 2.2f else 3f
                  r(c, 4f, 8f, 1f, la, body)
                  r(c, 6f, 8f, 1f, lb, body)
                  r(c, 9f, 8f, 1f, lb, body)
                  r(c, 11f, 8f, 1f, la, body)

                  // лицо
                  when (mood) {
                      0 -> if (blink) {
                          r(c, 5f, 4f, 1f, 0.4f, dark)
                          r(c, 10f, 4f, 1f, 0.4f, dark)
                      } else {
                          r(c, 5f, 3f, 1f, 2f, dark)
                          r(c, 10f, 3f, 1f, 2f, dark)
                      }
                      1 -> {
                          val eye = listOf("010", "101")
                          pat(c, 4, 3, eye, dark)
                          pat(c, 10, 3, eye, dark)
                          pat(c, 7, 6, listOf("101", "010"), dark)
                      }
                      2 -> {
                          val heart = listOf("101", "111", "010")
                          pat(c, 4, 3, heart, red)
                          pat(c, 10, 3, heart, red)
                      }
                      3 -> {
                          val x = listOf("101", "010", "101")
                          pat(c, 4, 3, x, dark)
                          pat(c, 10, 3, x, dark)
                      }
                      4 -> {
                          r(c, 5f, 3f, 1f, 2f, dark)
                          r(c, 10f, 3f, 1f, 2f, dark)
                          r(c, 7.5f, 6f, 1f, 1.5f, dark)
                      }
                      5 -> {
                          r(c, 5f, 3f, 1f, 2f, dark)
                          r(c, 10f, 3f, 1f, 2f, dark)
                          r(c, 4f, 2f, 2f, 0.6f, dark)
                          r(c, 10f, 2f, 2f, 0.6f, dark)
                          r(c, 7f, 6f, 2f, 0.6f, dark)
                      }
                  }

                  // ноутбук: достаёт, открывает, печатает, закрывает
                  if (typing) {
                      val t = laptopTick
                      if (t <= 0 || t >= 15) {
                          r(c, 4f, 9f, 8f, 1f, lap)
                      } else if (t == 1 || t == 14) {
                          r(c, 4f, 7.5f, 8f, 2.5f, lap)
                      } else {
                          r(c, 4f, 6f, 8f, 4f, lap)
                          r(c, 7f, 7.5f, 2f, 1f, lapDark)
                          r(c, 3f, 10f, 10f, 0.7f, lapDark)
                      }
                  }
                  c.restore()
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/ClawdService.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import kotlin.math.abs
          import kotlin.random.Random

          class ClawdService : Service() {

              private lateinit var wm: WindowManager
              private var clawd: ClawdView? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  showClawd()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("clawd", "Clawd", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "clawd")
                      .setContentTitle("Clawd с тобой")
                      .setSmallIcon(android.R.drawable.star_on)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, 0x40000000)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun showClawd() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val view = ClawdView(this)
                  clawd = view

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 100
                  lp.y = 400

                  val handler = Handler(Looper.getMainLooper())
                  var dx = 0f
                  var dy = 0f
                  var sx = 0
                  var sy = 0
                  var moved = false

                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = e.rawX
                              dy = e.rawY
                              sx = lp.x
                              sy = lp.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val mx = e.rawX - dx
                              val my = e.rawY - dy
                              if (abs(mx) > 10 || abs(my) > 10) moved = true
                              lp.x = sx + mx.toInt()
                              lp.y = sy + my.toInt()
                              wm.updateViewLayout(view, lp)
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  val k = Random.nextInt(0, 6)
                                  if (k == 0) {
                                      view.startLaptop()
                                  } else {
                                      view.mood = k
                                      handler.postDelayed({ view.mood = 0 }, 2000)
                                  }
                              }
                          }
                      }
                      true
                  }
                  wm.addView(view, lp)
              }

              override fun onDestroy() {
                  clawd?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/MainActivity.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                      )
                  } else {
                      startForegroundService(Intent(this, ClawdService::class.java))
                      finish()
                  }
              }
          }
          EOF_CLAWD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-APK
          path: app/build/outputs/apk/debug/app-debug.apk
