name: Build Clawd APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          set -e
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_CLAWD'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Clawd"
          include(":app")
          EOF_CLAWD
          mkdir -p .
          cat > build.gradle.kts <<'EOF_CLAWD'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_CLAWD
          mkdir -p .
          cat > gradle.properties <<'EOF_CLAWD'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_CLAWD
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_CLAWD'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.clawd"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.clawd"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_CLAWD'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Clawd"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ClawdService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating mascot overlay"/>
                  </service>
              </application>
          </manifest>
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/ClawdView.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import kotlin.random.Random

          class ClawdView(ctx: Context) : View(ctx) {

              private val paint = Paint()
              // одна клетка в целых пикселях экрана: так между клетками нет щелей
              private val s = Math.round(resources.displayMetrics.density * 2.5f)

              // O тело, D тень, G ноутбук, E глаз, . пусто
              // Clawd спереди: форма из иконки мода MargyC (12x8 пикселей, каждый пиксель = 2x2 клетки)
              private val front = arrayOf(
                  "..OOOOOOOO..",
                  "..OEOOOOEO..",
                  "OOOOOOOOOOOO",
                  "OOOOOOOOOOOO",
                  "..OOOOOOOO..",
                  "..OOOOOOOO..",
                  "..O.O..O.O..",
                  "..O.O..O.O.."
              )

              // Анимация Laptop (Clawd в профиль с ноутбуком): 3 кадра по кругу, 12 кадров в секунду
              private val laptop = arrayOf(
                  arrayOf(
                      "...............................",
                      "...............................",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOOOOOOOOOOOOOO..........",
                      "..DDDDOOOOOOOOOOOOOOO..........",
                      "..DDDDOOOOOOOOOOOOOOO..........",
                      "..DDDDOOOOOOOOOOOOOOO.......G..",
                      "..DDDDOOOOOOOOOOOO.........GG..",
                      "..DDDDOOOOOOOOOOOODDDD....GG...",
                      "..DD..OO....OO..OODDDD...GG....",
                      ".DDD.OOO...OOO.OOODDDD..GG.....",
                      ".DD..OO....OO..OO..GGGGGG......",
                      "...............................",
                      "..............................."
                  ),
                  arrayOf(
                      "...............................",
                      "...............................",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOOOOOOOOOOODDDD.........",
                      "..DDDDOOOOOOOOOOOODDDD.........",
                      "..DDDDOOOOOOOOOOOOOOOD.........",
                      "..DDDDOOOOOOOOOOOOOOOD......G..",
                      "..DDDDOOOOOOOOOOOOOOOD.....GG..",
                      "..DDDDOOOOOOOOOOOOOOO.....GG...",
                      "..DD..OO....OO..OOOOO....GG....",
                      ".DDD.OOO...OOO.OOO......GG.....",
                      ".DD..OO....OO..OO..GGGGGG......",
                      "...............................",
                      "..............................."
                  ),
                  arrayOf(
                      "...............................",
                      "...............................",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOEEOOOOEE...............",
                      "..DDDDOOOOOOOOOOOO.............",
                      "..DDDDOOOOOOOOOOOOOOO..........",
                      "..DDDDOOOOOOOOOOOOOOOD......G..",
                      "..DDDDOOOOOOOOOOOOOOOD.....GG..",
                      "..DDDDOOOOOOOOOOOOOOOD....GG...",
                      "..DDDDOOOOOOOOOOOODDDD...GG....",
                      "..DD..OO....OO..OO......GG.....",
                      ".DDD.OOO...OOO.OOO.GGGGGG......",
                      ".DD..OO....OO..OO..............",
                      "...............................",
                      "..............................."
                  )
              )

              private var tick = 0
              private var laptopLeft = 0
              private var jumpLeft = 0
              private var blinkLeft = 0
              private val handler = Handler(Looper.getMainLooper())

              fun startLaptop() {
                  if (laptopLeft == 0 && jumpLeft == 0) laptopLeft = 96   // около 8 секунд
              }

              private val loop = object : Runnable {
                  override fun run() {
                      tick++
                      if (laptopLeft > 0) {
                          laptopLeft--
                          if (laptopLeft == 0) jumpLeft = 42              // дописал: 2 прыжка
                      } else if (jumpLeft > 0) {
                          jumpLeft--
                      } else if (Random.nextInt(480) == 0) {
                          laptopLeft = 96                                 // сам достаёт ноутбук раз в ~40 секунд
                      }
                      if (blinkLeft > 0) {
                          blinkLeft--
                      } else if (Random.nextInt(60) == 0) {
                          blinkLeft = 3
                      }
                      invalidate()
                      handler.postDelayed(this, 83)
                  }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  handler.post(loop)
              }

              override fun onDetachedFromWindow() {
                  handler.removeCallbacks(loop)
                  super.onDetachedFromWindow()
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(31 * s, 26 * s)
              }

              // один сплошной цвет тела (тень убрана), серый для ноутбука
              private fun color(ch: Char): Int = when (ch) {
                  'O', 'D' -> 0xFFDA7756.toInt()
                  'G' -> 0xFF938882.toInt()
                  'E' -> 0xFF111111.toInt()
                  else -> 0
              }

              private fun drawGrid(c: Canvas, rows: Array<String>, x0: Int, y0: Int, cell: Int, blink: Boolean) {
                  for (j in rows.indices) {
                      val row = rows[j]
                      for (i in row.indices) {
                          val ch = row[i]
                          if (ch == '.') continue
                          paint.color = if (blink && ch == 'E') color('O') else color(ch)
                          val l = x0 + i * cell
                          val t = y0 + j * cell
                          c.drawRect(l.toFloat(), t.toFloat(), (l + cell).toFloat(), (t + cell).toFloat(), paint)
                      }
                  }
              }

              override fun onDraw(c: Canvas) {
                  val top = 8 * s
                  if (laptopLeft > 0) {
                      drawGrid(c, laptop[tick % 3], 0, top, s, false)
                  } else {
                      var lift = 0
                      if (jumpLeft > 0) {
                          val phase = (42 - jumpLeft) % 21
                          if (phase < 14) {
                              lift = Math.round(Math.sin(Math.PI * phase / 14.0) * 8.0).toInt()
                          }
                      }
                      drawGrid(c, front, 2 * s, top - lift * s, 2 * s, blinkLeft > 0)
                  }
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/ClawdService.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import kotlin.math.abs
          import kotlin.random.Random

          class ClawdService : Service() {

              private lateinit var wm: WindowManager
              private var clawd: ClawdView? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  showClawd()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("clawd", "Clawd", NotificationManager.IMPORTANCE_MIN)
                  )
                  val n = Notification.Builder(this, "clawd")
                      .setContentTitle("Clawd с тобой")
                      .setSmallIcon(android.R.drawable.star_on)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, 0x40000000)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun showClawd() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val view = ClawdView(this)
                  clawd = view

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 100
                  lp.y = 400

                  val handler = Handler(Looper.getMainLooper())
                  var dx = 0f
                  var dy = 0f
                  var sx = 0
                  var sy = 0
                  var moved = false

                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = e.rawX
                              dy = e.rawY
                              sx = lp.x
                              sy = lp.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val mx = e.rawX - dx
                              val my = e.rawY - dy
                              if (abs(mx) > 10 || abs(my) > 10) moved = true
                              lp.x = sx + mx.toInt()
                              lp.y = sy + my.toInt()
                              wm.updateViewLayout(view, lp)
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  view.startLaptop()
                              }
                          }
                      }
                      true
                  }
                  wm.addView(view, lp)
              }

              override fun onDestroy() {
                  clawd?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF_CLAWD
          mkdir -p app/src/main/java/com/example/clawd
          cat > app/src/main/java/com/example/clawd/MainActivity.kt <<'EOF_CLAWD'
          package com.example.clawd

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                      )
                  } else {
                      startForegroundService(Intent(this, ClawdService::class.java))
                      finish()
                  }
              }
          }
          EOF_CLAWD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-APK
          path: app/build/outputs/apk/debug/app-debug.apk
